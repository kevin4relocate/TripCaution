name: TripCaution manual Cloudflare deploy

# Emergency alternative when Cloudflare Git builds stall at Initializing.
# Explicit, owner-only manual trigger. Never executes database migrations.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY to publish current main to tripcaution"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tripcaution-manual-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets before manual deployment."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate worker
        run: npm run check && npm test && npm run audit:content && npm run audit:cautions
      - name: Deploy verified main to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Confirm public endpoints respond
        env:
          SITE_URL: https://tripcaution.nghiep4tube.workers.dev
        run: node scripts/smoke-production.mjs
