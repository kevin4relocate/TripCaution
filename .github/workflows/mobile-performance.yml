name: TripCaution mobile + performance launch audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-performance.yml'
      - 'scripts/summarize-mobile-audit.mjs'
      - 'public/**'
      - 'src/**'
      - 'wrangler.jsonc'
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: ${{ vars.TRIPCAUTION_API_URL || 'https://tripcaution.nghiep4tube.workers.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Allow production deployment to settle
        run: sleep 60
      - name: Resolve 14 mobile launch targets
        run: |
          mkdir -p audits
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const origin=process.env.SITE_URL.replace(/\/$/,'');
          const countries=[
            ['Brunei','brunei'],['Cambodia','cambodia'],['Indonesia','indonesia'],['Laos','laos'],
            ['Malaysia','malaysia'],['Myanmar','myanmar'],['Philippines','philippines'],
            ['Singapore','singapore'],['Thailand','thailand'],['Timor-Leste','timor-leste'],['Vietnam','vietnam']
          ];
          const get=async path=>{
            const response=await fetch(origin+path,{signal:AbortSignal.timeout(20000),headers:{'User-Agent':'TripCaution-Mobile-Launch-Audit/1.0'}});
            if(!response.ok)throw Error(path+' returned HTTP '+response.status);
            return response.text();
          };
          const targets=[
            {label:'Homepage',file:'home',url:origin+'/'},
            {label:'Destinations',file:'destinations',url:origin+'/destinations'},
            {label:'Caution topics',file:'cautions',url:origin+'/cautions'}
          ];
          for(const [country,slug] of countries){
            const html=await get('/destinations/'+slug);
            const links=[...html.matchAll(/href=["'](\/guides\/[^"'#?]+)["']/g)].map(x=>x[1]);
            const guide=[...new Set(links)][0];
            if(!guide)throw Error('No public guide link found on '+country+' destination page');
            targets.push({label:country+' guide',file:'guide-'+slug,url:origin+guide});
          }
          if(targets.length!==14)throw Error('Expected 14 mobile audit targets, got '+targets.length);
          if(new Set(targets.map(t=>t.url)).size!==targets.length)throw Error('Duplicate mobile audit target URL');
          writeFileSync('audits/targets.json',JSON.stringify(targets,null,2));
          console.log(targets.map(t=>t.label+' -> '+t.url).join('\n'));
          NODE
      - name: Install pinned Lighthouse CLI
        run: npm install --global lighthouse@12
      - name: Run simulated mobile Lighthouse audits
        run: |
          node --input-type=module <<'NODE' > /tmp/mobile-targets.txt
          import {readFileSync} from 'node:fs';
          for(const target of JSON.parse(readFileSync('audits/targets.json','utf8')))
            console.log(target.file+'\t'+target.url);
          NODE
          failures=0
          while IFS=$'\t' read -r file target; do
            echo "Auditing $file: $target"
            if ! lighthouse "$target"               --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"               --form-factor=mobile               --screenEmulation.mobile=true               --screenEmulation.width=390               --screenEmulation.height=844               --screenEmulation.deviceScaleFactor=3               --only-categories=performance,accessibility,best-practices,seo               --throttling-method=simulate               --output=json               --output-path="./audits/$file.json"               --quiet; then
              echo "::error::Lighthouse failed for $target"
              failures=$((failures+1))
            fi
          done < /tmp/mobile-targets.txt
          echo "Raw Lighthouse command failures: $failures"
      - name: Summarize and gate mobile launch metrics
        run: |
          node scripts/summarize-mobile-audit.mjs audits audits/targets.json
          cat audits/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload mobile performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tripcaution-mobile-performance-launch-audit
          path: audits/
          if-no-files-found: error
          retention-days: 30
