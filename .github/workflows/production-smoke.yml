name: TripCaution production smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-smoke.yml'
      - 'scripts/smoke-production.mjs'
      - 'src/**'
      - 'public/**'
      - 'wrangler.jsonc'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Allow latest Worker deploy to settle
        run: sleep 45
      - name: Public production launch smoke (no credentials)
        env:
          SITE_URL: ${{ vars.TRIPCAUTION_API_URL || 'https://tripcaution.nghiep4tube.workers.dev' }}
        run: node scripts/smoke-production.mjs
      - name: Upload launch-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tripcaution-public-smoke
          path: sprint1-production-security.json
          if-no-files-found: error
          retention-days: 14
