name: TripCaution daily research
on:
  workflow_dispatch:
  schedule:
    # 02:17 Singapore time (18:17 UTC previous day).
    - cron: '17 18 * * *'
permissions:
  contents: read
concurrency:
  group: tripcaution-daily-editorial
  cancel-in-progress: false
jobs:
  create-article:
    if: ${{ vars.TRIPCAUTION_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose API connectivity without exposing any secrets
        env:
          TRIPCAUTION_API_URL: ${{ vars.TRIPCAUTION_API_URL }}
          TRIPCAUTION_INGEST_TOKEN: ${{ secrets.TRIPCAUTION_INGEST_TOKEN }}
        run: python scripts/diagnose-ingest.py
      - name: Generate one researched article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TRIPCAUTION_RESEARCH_MODE: ${{ vars.TRIPCAUTION_RESEARCH_MODE }}
          TRIPCAUTION_CONTENT_PHASE: ${{ vars.TRIPCAUTION_CONTENT_PHASE || '1' }}
          TRIPCAUTION_API_URL: ${{ vars.TRIPCAUTION_API_URL }}
          TRIPCAUTION_INGEST_TOKEN: ${{ secrets.TRIPCAUTION_INGEST_TOKEN }}
        run: python automation/daily.py
