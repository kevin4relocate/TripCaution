name: TripCaution checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: JavaScript validation
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Python syntax
        run: python -m py_compile automation/daily.py automation/import_starter.py
