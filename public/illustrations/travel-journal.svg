  <linearGradient id="sea" x1="0" x2="1"><stop stop-color="#b8cbd0"/><stop offset="1" stop-color="#d7dbd0"/></linearGradient>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".46" numOctaves="3" seed="8" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".09"/></feComponentTransfer></filter>
</defs>
