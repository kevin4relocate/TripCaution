<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
<title id="title">Illustrated travel journal landscape</title>
<desc id="desc">A softly painted coastal travel scene with winding paths, warm sun, distant hills, and little houses.</desc>
<defs>
