<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">A calm Singapore MRT platform with a contactless payment card</title><desc id="d">AI-authored editorial illustration. Not a photograph.</desc>
<defs>
 <linearGradient id="paper" x2=".8" y2="1"><stop stop-color="#f4ecd8"/><stop offset="1" stop-color="#c5d9cb"/></linearGradient>
